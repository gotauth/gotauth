# The GotAuth docs site (work package G2). Build and preview in the dev container:
#   ./dev.sh uv run --group docs mkdocs build -f apps/docs/mkdocs.yml
#   (preview: see apps/docs/README.md)
site_name: GotAuth
site_url: https://gotauth.ablacky.com/docs/
site_description: >-
  Open-source auth for Python AI backends: users, sessions, social login, 2FA, passkeys,
  organizations, API keys, agent identities and an OAuth 2.1 server for MCP servers.
repo_url: https://github.com/gotauth/gotauth
repo_name: gotauth/gotauth
edit_uri: edit/main/apps/docs/docs/
docs_dir: docs
site_dir: site
strict: true
# Reached from the API reference index, not the navigation.
not_in_nav: |
  /reference/gotauth*.md

theme:
  name: material
  # System fonts: no requests to Google Fonts, like the landing page.
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../../src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: false
            heading_level: 2

# hooks.py: pages from the module READMEs and the API reference, Markdown copies of
# every page, llms.txt and llms-full.txt.
hooks:
  - hooks.py

extra_javascript:
  - js/copy-markdown.js
extra_css:
  - css/extra.css

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Principals and scopes: concepts/principals.md
      - Sessions: concepts/sessions.md
      - Plugins and hooks: concepts/plugins-and-hooks.md
      - Schema and migrations: concepts/schema-and-migrations.md
      - Events: concepts/events.md
  - Guides:
      - MCP servers: guides/mcp.md
      - API keys: guides/api-keys.md
      - Agents: guides/agents.md
      - Testing your auth: guides/testing.md
      - Migrate from fastapi-users: guides/migrate-from-fastapi-users.md
  - Plugins:
      - API keys: plugins/api-keys.md
      - Two-factor: plugins/two-factor.md
      - Passkeys: plugins/passkeys.md
      - Magic links and email codes: plugins/magic-link.md
      - Organizations: plugins/organizations.md
      - Admin: plugins/admin.md
      - OAuth 2.1 server: plugins/oauth-provider.md
      - Agents: plugins/agents.md
  - Integrations:
      - FastAPI: integrations/fastapi.md
      - Starlette and Litestar: integrations/starlette-litestar.md
      - MCP: integrations/mcp.md
  - Modules:
      - Core: modules/core.md
      - Email and password: modules/email-password.md
      - Sessions: modules/sessions.md
      - Social login: modules/social.md
      - Email delivery: modules/email.md
      - Crypto: modules/crypto.md
      - SQLAlchemy storage: modules/storage-sqlalchemy.md
      - Memory storage: modules/storage-memory.md
      - CLI: modules/cli.md
      - Testing kit: modules/testing.md
      - gotauth check: modules/checkup.md
      - Contracts: modules/contracts.md
  - API reference: reference/index.md
  - Security: security.md
  - Comparison: comparison.md
  - Troubleshooting: troubleshooting.md
