[project]
name = "gotauth-example-fastapi-nextjs"
version = "0.0.0"
description = "GotAuth example: FastAPI backend for the Next.js frontend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142",
  "gotauth[fastapi,sqlalchemy,sqlite,postgres,passkey]",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pyright>=1.1.414",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.sources]
# The library from this repository, so the example always runs the current code.
gotauth = { path = "../../..", editable = true }

[tool.ruff]
extend = "../../../pyproject.toml"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app", "tests", "migrations/env.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
