# Release (work package Q1). Pushing a tag vX.Y.Z checks, builds and publishes to
# PyPI with trusted publishing (PEP 740 attestations, on by default in
# pypa/gh-action-pypi-publish since v1.11), then makes the GitHub release from the
# towncrier section of CHANGELOG.md. Running it by hand publishes to TestPyPI only.
# Actions are pinned by commit SHA; the comment names the release.
#
# Before tagging: set __version__ in src/gotauth/__init__.py, run
# `./dev.sh uv run towncrier build --version X.Y.Z --yes`, and commit both.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run to TestPyPI

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep equal to the uv image tag in docker/dev.Dockerfile.
  UV_VERSION: "0.12.22"
  FORCE_COLOR: "1"

jobs:
  check:
    name: Version, changelog and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --all-extras
      - name: Tag, version and changelog agree
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run python -c 'import gotauth; print(gotauth.__version__)')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match __version__ $version"
            exit 1
          fi
          if ! grep -q "^## $version (" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version; run towncrier build"
            exit 1
          fi
      - name: Format, lint, types and tests
        run: uv run poe check

  build:
    name: Build wheel and sdist
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gotauth/
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gotauth/
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The section from "## X.Y.Z (" up to the next "## " heading.
          awk -v v="${TAG#v}" '
            index($0, "## " v " (") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
