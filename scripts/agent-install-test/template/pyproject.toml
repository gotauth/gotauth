[project]
name = "projects-api"
version = "0.1.0"
description = "A small FastAPI app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
# The agent-install test: GotAuth comes from the wheel built from this checkout
# (mounted at /wheels), standing in for a current release on PyPI.
gotauth = { path = "/wheels/gotauth-0.0.1-py3-none-any.whl" }

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
